# Render Blueprint: deploys the Machi backend + web app.
services:
  - type: web
    name: machi-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/machi/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # you paste the key in Render's dashboard; it is never stored in this repo
      - key: GEMINI_MODELS
        value: gemini-3.8-flash,gemini-flash-latest,gemini-3.5-flash-lite
      - key: CHAT_TIMEOUT_MS
        value: "25000"
      - key: CHAT_HEDGE_MS
        value: "5000"
